name: Build desktop installers

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-15
            artifact: ObsidianQuery-macOS
          - name: Windows EXE
            os: windows-2022
            artifact: ObsidianQuery-Windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build-desktop-macos.sh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop-windows.ps1

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows EXE
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

