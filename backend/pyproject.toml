[project]
name = "backend"
version = "0.1.0"
description = "Local backend core for an Obsidian query assistant"
readme = "README.md"
authors = [
    { name = "quanhoang55", email = "quanhoang1026@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
